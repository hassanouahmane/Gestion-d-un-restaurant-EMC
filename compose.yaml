services:
  application:
    build: .
    ports:
      - "127.0.0.1:${RESTAURANT_PORT:-8080}:80"
    environment:
      APP_ENV: dev
      APP_DEBUG: 0
      DATABASE_URL: "mysql://restaurant_app:demo_mysql@database:3306/restaurant?serverVersion=8.4&charset=utf8mb4"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-RestaurantDemo!2026}"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 20

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: restaurant
      MYSQL_USER: restaurant_app
      MYSQL_PASSWORD: demo_mysql
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" --password=\"$$MYSQL_PASSWORD\" -e 'SELECT 1' \"$$MYSQL_DATABASE\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - restaurant_mysql:/var/lib/mysql

volumes:
  restaurant_mysql:
